name: Neuracore
description: >-
  Neuracore is an end-to-end cloud platform for robot skill creation. Teams use
  it to collect teleoperation demonstrations, curate and version datasets, train
  imitation-learning and reinforcement-learning policies, and deploy them to
  production robots for real-time inference. The platform is driven by an
  official Python SDK and command-line interface (pip install neuracore) that
  stream 14 first-class data modalities to the Neuracore cloud backend at
  api.neuracore.com, plus a Rust data daemon for high-throughput recording.
  Founded by Stephen James and backed by Earlybird, Neuracore is used by robotics
  teams including Anvil Robotics, AIRA, Flexiv and Scale AI.
